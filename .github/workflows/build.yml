name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Project Structure & Gradle Files
        run: |
          mkdir -p app/src/main/java/com/speedtouch/clicker
          
          # Root build.gradle with Google and Maven Central repositories
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.0" } }' > build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle

          # App level build.gradle
          echo 'apply plugin: "com.android.application"' > app/build.gradle
          echo 'android { compileSdk 33; defaultConfig { applicationId "com.speedtouch.clicker"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0"; } }' >> app/build.gradle

          # Settings.gradle
          echo 'include ":app"' > settings.gradle

      - name: Move MainActivity
        run: mv MainActivity.java app/src/main/java/com/speedtouch/clicker/

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.0
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
