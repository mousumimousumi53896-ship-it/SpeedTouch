name: Build Java App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java Code
        run: |
          mkdir -p build/classes
          javac MainActivity.java -d build/classes

      - name: Create JAR File
        run: |
          cd build/classes
          jar cfe ../SpeedTouch.jar MainActivity .

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedtouch-jar
          path: build/SpeedTouch.jar
          
